name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify Pinning
        uses: ffalcinelli/pinner/action@dff77e1d17140dc88eb827aa7d833f995796b92b # v0.0.11

  build-and-test:
    strategy:
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make gcc pkg-config libelf-dev zlib1g-dev ethtool iproute2

      - name: Check BTF support
        run: |
          ls -l /sys/kernel/btf/vmlinux || echo "BTF not found in /sys/kernel/btf/vmlinux"
          uname -a

      - name: Verify Version Alignment
        run: make check-version

      - name: Build
        run: make -j"$(nproc)"

      - name: Filter conformance (unprivileged)
        run: make check

      - name: BPF program tests
        run: sudo ./test_bpf ebpfdivert.bpf.o

      - name: Integration tests
        run: sudo ./tests/run_integration_tests.sh
