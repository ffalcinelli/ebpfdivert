name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev make gcc linux-headers-generic

      - name: Check BTF support
        run: |
          ls -l /sys/kernel/btf/vmlinux || echo "BTF not found in /sys/kernel/btf/vmlinux"
          uname -a

      - name: Build
        run: make

      - name: Run tests
        run: sudo ./test_bpf ebpfdivert.bpf.o
